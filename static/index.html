<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dynamic Pricing Agent Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#0b0f10] text-emerald-50 min-h-screen p-6 md:p-10">
  <div class="max-w-6xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-emerald-950/80 pb-6">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-emerald-100">Competitive Intelligence & Dynamic Pricing</h1>
        <p class="text-xs text-emerald-400/60 mt-1 font-normal tracking-wide">Autonomous Multi-Agent E-Commerce Repricing Engine</p>
      </div>
      <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        System Active
      </span>
    </header>

    <!-- Product Catalog & Agent Trigger -->
    <section class="bg-[#111718] rounded-xl p-6 border border-emerald-950 shadow-sm">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-emerald-400/70 mb-5">Tracked Catalog Items</h2>
      <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <p class="text-emerald-800 text-sm">Loading products...</p>
      </div>
    </section>

    <!-- Execution Logs & Human-in-the-Loop Review -->
    <section class="bg-[#111718] rounded-xl p-6 border border-emerald-950 shadow-sm">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-emerald-400/70 mb-5">Agent Decision Audit Trail</h2>
      <div class="overflow-x-auto rounded-lg border border-emerald-950/60">
        <table class="w-full text-left text-sm text-emerald-200/80">
          <thead class="text-xs uppercase bg-[#141d1e] text-emerald-400/60 border-b border-emerald-950">
            <tr>
              <th class="p-3.5 font-medium">Time</th>
              <th class="p-3.5 font-medium">Old Price</th>
              <th class="p-3.5 font-medium">Suggested</th>
              <th class="p-3.5 font-medium">Final Applied</th>
              <th class="p-3.5 font-medium">Status</th>
              <th class="p-3.5 font-medium">Reasoning</th>
              <th class="p-3.5 font-medium text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="logs-table-body" class="divide-y divide-emerald-950/40 bg-[#0d1314]">
            <tr><td colspan="7" class="p-6 text-center text-emerald-800 text-sm">No logs found yet. Click 'Run Agent' above.</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    async function loadProducts() {
      try {
        const res = await fetch(`${API_BASE}/products`);
        const products = await res.json();
        const container = document.getElementById("products-container");
        
        container.innerHTML = products.map(p => `
          <div class="bg-[#141e1f] p-5 rounded-lg border border-emerald-950 hover:border-emerald-800/60 transition flex justify-between items-center">
            <div class="space-y-1">
              <span class="text-[11px] text-teal-300 font-mono uppercase tracking-wider bg-teal-950/60 px-1.5 py-0.5 rounded border border-teal-900/60">${p.sku}</span>
              <div class="text-base font-semibold text-emerald-100 pt-0.5">${p.title}</div>
              <div class="text-xs text-emerald-400/60">
                Base Cost: <span class="text-emerald-200 font-medium">$${p.base_cost.toFixed(2)}</span> · 
                Listed: <span class="text-teal-400 font-semibold">$${p.current_price.toFixed(2)}</span>
              </div>
              <div class="text-[11px] text-emerald-600">Margin Floor: ${(p.min_margin_percent * 100).toFixed(0)}%</div>
            </div>
            <button onclick="runAgent(${p.id})" id="btn-${p.id}" class="bg-teal-500 hover:bg-teal-400 text-[#0b0f10] font-semibold px-4 py-2 rounded-md text-xs transition active:scale-[0.98] shadow-sm disabled:opacity-50">
              Run Agent
            </button>
          </div>
        `).join('');

        if (products.length > 0) {
          await loadLogs(products[0].id);
        }
      } catch (err) {
        console.error("Failed to load products:", err);
      }
    }

    async function runAgent(productId) {
      const btn = document.getElementById(`btn-${productId}`);
      btn.innerText = "Processing...";
      btn.disabled = true;

      try {
        const response = await fetch(`${API_BASE}/agent/run/${productId}`, { method: "POST" });
        if (!response.ok) throw new Error(`Server returned ${response.status}`);
        await loadProducts();
        await loadLogs(productId);
      } catch (err) {
        alert("Error executing agent: " + err.message);
      } finally {
        btn.innerText = "Run Agent";
        btn.disabled = false;
      }
    }

    async function loadLogs(productId) {
      try {
        const res = await fetch(`${API_BASE}/logs/${productId}`);
        const logs = await res.json();
        const tbody = document.getElementById("logs-table-body");

        if (!logs || logs.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-emerald-800 text-sm">No logs found yet. Click 'Run Agent' above.</td></tr>`;
          return;
        }

        tbody.innerHTML = logs.map(log => `
          <tr class="hover:bg-emerald-950/20 transition-colors">
            <td class="p-3.5 text-xs text-emerald-400/60 font-mono">${new Date(log.created_at).toLocaleTimeString()}</td>
            <td class="p-3.5 font-mono text-xs text-emerald-400/60">$${log.old_price.toFixed(2)}</td>
            <td class="p-3.5 font-mono text-xs text-teal-300 font-medium">$${log.suggested_price.toFixed(2)}</td>
            <td class="p-3.5 font-mono text-xs font-semibold text-emerald-400">$${log.final_price.toFixed(2)}</td>
            <td class="p-3.5">
              <span class="px-2 py-0.5 rounded text-[11px] font-mono tracking-tight ${
                log.status === 'AUTO_APPLIED' 
                  ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                  : log.status === 'PENDING_APPROVAL'
                  ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
                  : 'bg-teal-500/10 text-teal-400 border border-teal-500/20'
              }">
                ${log.status}
              </span>
            </td>
            <td class="p-3.5 text-xs text-emerald-300/80 max-w-xs truncate" title="${log.reasoning}">${log.reasoning}</td>
            <td class="p-3.5 text-right">
              ${log.status === 'PENDING_APPROVAL' ? `
                <div class="inline-flex gap-1.5">
                  <button onclick="handleApproval(${log.id}, 'APPROVE', ${productId})" class="text-xs bg-emerald-500 hover:bg-emerald-400 text-black font-semibold px-2.5 py-1 rounded transition">Approve</button>
                  <button onclick="handleApproval(${log.id}, 'REJECT', ${productId})" class="text-xs bg-emerald-950 hover:bg-emerald-900 text-emerald-200 font-medium px-2.5 py-1 rounded border border-emerald-800 transition">Reject</button>
                </div>
              ` : `<span class="text-xs text-emerald-700 font-mono">Done</span>`}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error("Failed to load logs:", err);
      }
    }

    async function handleApproval(logId, action, productId) {
      try {
        await fetch(`${API_BASE}/agent/approval/${logId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: action })
        });
        await loadProducts();
        await loadLogs(productId);
      } catch (err) {
        alert("Approval failed: " + err.message);
      }
    }

    window.onload = loadProducts;
  </script>
</body>
</html>
